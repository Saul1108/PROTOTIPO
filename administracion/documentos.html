        const claves = Object.keys(biblioteca);
        const indexActual = claves.indexOf(temaId);

        const container = document.getElementById('image-viewer-container');
        const title = document.getElementById('titulo-doc');
        const linkModulo = document.getElementById('link-modulo');
        const bread = document.getElementById('bread-actual');
        const btnAnterior = document.getElementById('btn-anterior');
        const btnSiguiente = document.getElementById('btn-siguiente');

        if (biblioteca[temaId]) {
            const data = biblioteca[temaId];
            title.innerText = data.n;
            if (bread) bread.innerText = data.n;

            // Actualizar color de fondo según el módulo
            const mapaColores = {
                'admin': '#eeeaf1',
                'ut': '#ecf5f6',
                'ar': '#fbe6f2',
                'ct': '#f9f4f6',
                'rev': '#ebebeb',
                'con': '#d3dbef'
            };
            if (data.mod && mapaColores[data.mod]) {
                document.body.style.backgroundColor = mapaColores[data.mod];
            }

            // Limpiar contenedor
            container.innerHTML = '';

            // Función auxiliar para resolver la ruta de la imagen o video
            const resolverRuta = (nombre) => {
                if (!nombre) return '';
                // Si el nombre ya incluye una carpeta (tiene /), lo usamos tal cual
                return nombre.includes('/') ? nombre : "img/" + nombre;
            };

            const nombreBase = `Guia_${data.n.replace(/[\s/\\:*?"<>|]/g, '_')}`;

            if (data.vid) {
                // Cargar video
                const videoElement = document.createElement('video');
                videoElement.src = resolverRuta(data.vid);
                videoElement.controls = true;
                videoElement.style.width = '100%';
                videoElement.style.maxWidth = '100%';
                videoElement.style.height = 'auto';
                videoElement.style.display = 'block';
                videoElement.style.border = '1px solid #eee';
                container.appendChild(videoElement);

                // --- Configurar descarga del video ---
                const videoUrl = resolverRuta(data.vid);
                fetch(videoUrl)
                    .then(r => r.ok ? r.blob() : Promise.reject())
                    .then(blob => {
                        const urlBlob = window.URL.createObjectURL(blob);
                        linkModulo.href = urlBlob;
                        const ext = data.vid.split('.').pop();
                        linkModulo.setAttribute('download', `${nombreBase}.${ext}`);
                    })
                    .catch(() => {
                        linkModulo.href = videoUrl;
                        linkModulo.setAttribute('download', data.vid.split('/').pop());
                    });

            } else {
                // Convertir img a array si es un string para manejarlo uniformemente
                const imagenes = Array.isArray(data.img) ? data.img : [data.img];
                const primeraImagen = resolverRuta(imagenes[0]);

                // Cargar todas las imágenes
                imagenes.forEach(nombreImg => {
                    const imgElement = document.createElement('img');
                    imgElement.src = resolverRuta(nombreImg);
                    imgElement.alt = data.n;
                    container.appendChild(imgElement);
                });

                // --- DESCARGA GUÍA DEL MÓDULO (imagen única o ZIP) ---
                if (imagenes.length === 1) {
                    // --- Imagen única: descarga directa ---
                    fetch(primeraImagen)
                        .then(r => r.ok ? r.blob() : Promise.reject())
                        .then(blob => {
                            const urlBlob = window.URL.createObjectURL(blob);
                            linkModulo.href = urlBlob;
                            const ext = imagenes[0].split('.').pop();
                            linkModulo.setAttribute('download', `${nombreBase}.${ext}`);
                        })
                        .catch(() => {
                            linkModulo.href = primeraImagen;
                            linkModulo.setAttribute('download', imagenes[0].split('/').pop());
                        });
                } else {
                    // --- Múltiples imágenes: empaquetar como ZIP ---
                    linkModulo.removeAttribute('href');
                    linkModulo.removeAttribute('download');
                    linkModulo.style.cursor = 'pointer';

                    linkModulo.addEventListener('click', async function (e) {
                        e.preventDefault();
                        // Indicador visual de progreso
                        const textoOriginal = linkModulo.innerHTML;
                        linkModulo.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparando ZIP...';
                        linkModulo.style.pointerEvents = 'none';

                        try {
                            const zip = new JSZip();
                            const carpeta = zip.folder(nombreBase);

                            await Promise.all(imagenes.filter(Boolean).map(async (nombreImg) => {
                                try {
                                    const r = await fetch(resolverRuta(nombreImg));
                                    if (r.ok) {
                                        const blob = await r.blob();
                                        carpeta.file(nombreImg.split('/').pop(), blob);
                                    }
                                } catch (_) { /* imagen no disponible, se omite */ }
                            }));

                            const zipBlob = await zip.generateAsync({ type: 'blob' });
                            const url = window.URL.createObjectURL(zipBlob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.target = '_blank';
                            a.download = `${nombreBase}.zip`;
                            document.body.appendChild(a);
                            a.click();
                            document.body.removeChild(a);
                            window.URL.revokeObjectURL(url);
                        } catch (err) {
                            alert('Error al generar el ZIP. Verifica tu conexión e inténtalo de nuevo.');
                        } finally {
                            linkModulo.innerHTML = textoOriginal;
                            linkModulo.style.pointerEvents = '';
                        }
                    });
                }
            }

            // Lógica Botón Anterior
            btnAnterior.onclick = () => {
                if (indexActual <= 0) {
                    window.location.href = 'guias.html';
                } else {
                    window.location.href = `?tema=${claves[indexActual - 1]}`;
                }
            };

            // Lógica Botón Siguiente
            btnSiguiente.onclick = () => {
                if (indexActual < claves.length - 1) {
                    window.location.href = `?tema=${claves[indexActual + 1]}`;
                } else {
                    alert("Has llegado al final de la guía.");
                }
            };

            // Ocultar Siguiente si es el último tema
            if (indexActual === claves.length - 1) {
                btnSiguiente.style.visibility = 'hidden';
            }

            // --- DESCARGA GUÍA COMPLETA (PDF según módulo) ---
            const mapaPDF = {
                'admin': 'assets/Infomex_Admin.pdf',
                'ut': 'assets/Infomex_UTGestion.pdf',
                'ar': 'assets/3-Areas_Responsables.pdf',
                'ct': 'assets/Infomex_CT.pdf',
                'rev': 'assets/Infomex_Revisor.pdf',
                'con': 'assets/INE_Consulta.pdf'
            };
            const linkGuiaCompleta = document.getElementById('link-guia-completa');
            if (data.mod && mapaPDF[data.mod]) {
                linkGuiaCompleta.href = mapaPDF[data.mod];
                linkGuiaCompleta.setAttribute('download', mapaPDF[data.mod]);
            }

        } else {
            // Manejo de error si el tema no existe
            title.innerText = "Error";
            if (bread) bread.innerText = "No encontrado";
            container.innerHTML = '<p style="padding: 20px;">No se encontró la información.</p>';
            if (linkModulo) linkModulo.style.display = "none";
            if (btnAnterior) btnAnterior.style.display = "none";
            if (btnSiguiente) btnSiguiente.style.display = "none";
        }
    </script>




    <script>
        // Abrir/Cerrar panel
        const accBtn = document.getElementById("accBtn");
        const accPanel = document.getElementById("accPanel");
        accBtn.onclick = () => accPanel.classList.toggle("open");
        accBtn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); accPanel.classList.toggle("open"); } };

        // Menú hamburguesa
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const headerNav = document.getElementById('headerNav');
        if (mobileBtn && headerNav) {
            mobileBtn.addEventListener('click', function () {
                headerNav.classList.toggle('active');
                const isExpanded = mobileBtn.getAttribute('aria-expanded') === 'true';
                mobileBtn.setAttribute('aria-expanded', !isExpanded);
            });
        }

        // Tamaño de letra
        const range = document.getElementById("fontRange");
        const small = document.getElementById("fontSmall");
        const big = document.getElementById("fontBig");

        function applyFont() {
            document.documentElement.style.fontSize = range.value + "px";
        }
        range.oninput = applyFont;
        small.onclick = () => { range.value = Math.max(12, parseInt(range.value) - 2); applyFont(); };
        big.onclick = () => { range.value = Math.min(30, parseInt(range.value) + 2); applyFont(); };

        // Modo nocturno
          const darkToggle = document.getElementById("darkToggle");

            if (localStorage.getItem("darkmode") === "1") {
                document.body.classList.add("dark-mode");
                darkToggle.checked = true;
            }

            darkToggle.onchange = () => {
                document.body.classList.toggle("dark-mode");

                localStorage.setItem(
                    "darkmode",
                    document.body.classList.contains("dark-mode") ? "1" : "0"
                );
            };
    </script>

    <!-- Botón Volver Arriba -->
    <button id="backToTopBtn" class="back-to-top" aria-label="Volver arriba">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        const backToTopBtn = document.getElementById("backToTopBtn");
        if (backToTopBtn) {
            window.addEventListener("scroll", () => {
                backToTopBtn.style.display = window.scrollY > 300 ? "flex" : "none";

                let footer = document.querySelector('.site-footer');
                if (footer) {
                    let footerRect = footer.getBoundingClientRect();
                    let windowHeight = window.innerHeight;
                    if (footerRect.top < windowHeight) {
                        backToTopBtn.style.bottom = (windowHeight - footerRect.top + 30) + 'px';
                    } else {
                        backToTopBtn.style.bottom = '30px';
                    }
                }
            });
            backToTopBtn.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
        }
    </script>
