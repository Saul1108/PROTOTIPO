<body>

    <main class="hero-section">

        <!-- BOTÓN LATERAL Y PANEL DE ACCESIBILIDAD -->
<div class="acc-wrapper">

    <!-- Botón lateral (abre el panel) -->
    <div id="accBtn" class="acc-button">
        <i class="fa-solid fa-universal-access"></i>
    </div>

    <!-- Panel emergente deslizante -->
    <div id="accPanel" class="acc-panel">

        <div class="acc-header">
            <i class="fa-solid fa-universal-access icon"></i>
            <span>Accesibilidad</span>
        </div>

        <div class="acc-content">

            <div class="font-size-row">
                <button id="fontSmall" class="fs-btn">a -</button>
                <input type="range" min="12" max="30" value="16" id="fontRange">
                <button id="fontBig" class="fs-btn">A+</button>
            </div>

            <div class="darkmode-row">
                <span>Modo nocturno</span>

                <label class="switch">
                    <input type="checkbox" id="darkToggle">
                    <span class="slider"></span>
                </label>
            </div>

        </div>
    </div>
</div>



        <div class="hero-content">
            <h2 class="welcome-title">Te damos la bienvenida al centro de ayuda de INFOMEX-INE</h2>

            <div class="cards-grid">
                <a href="guias.html" class="card">
                    <h3>Guías del sistema</h3>
                    <div class="card-icon"><i class="fa-regular fa-circle-question"></i></div>
                </a>

                <a href="documentosApoyo.html" class="card">
                    <h3>Documentos del apoyo</h3>

                    <h3>Glosario</h3>
                    <div class="abc-text">abc</div>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="images/INE.png" alt="Logo INE" class="footer-logo">
            <span>© INE México 2026</span>
        </div>
    </footer>





    <script>
const accBtn = document.getElementById("accBtn");
const accPanel = document.getElementById("accPanel");

// Abrir/cerrar panel
accBtn.onclick = () => {
    accPanel.classList.toggle("open");
};

// ------------------------
// TAMAÑO DE LETRA
// ------------------------
const range = document.getElementById("fontRange");
const small = document.getElementById("fontSmall");
const big = document.getElementById("fontBig");

function applyFont() {
    document.documentElement.style.fontSize = range.value + "px";
}

range.oninput = applyFont;

small.onclick = () => {
    range.value = Math.max(12, parseInt(range.value) - 2);
    applyFont();
};

big.onclick = () => {
    range.value = Math.min(30, parseInt(range.value) + 2);
    applyFont();
};

// ------------------------
// MODO NOCTURNO
// ------------------------
const darkToggle = document.getElementById("darkToggle");

// Restaurar
if (localStorage.getItem("darkmode") === "1") {
    document.body.classList.add("dark-mode");
    darkToggle.checked = true;
}

darkToggle.onchange = () => {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkmode", "1");
    } else {
        localStorage.removeItem("darkmode");
    }
};
</script>
