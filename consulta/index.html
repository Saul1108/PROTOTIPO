<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - INFOMEX-INE</title>
    <meta name="description"
        content="Centro de ayuda de INFOMEX-INE. Accede a guías del sistema, documentos de apoyo, glosario y tutoriales.">

    <link rel="stylesheet" type="text/css" href="css/font.css">
    <link rel="stylesheet" type="text/css" href="css/all.min.css">
    <link rel="stylesheet" type="text/css" href="css/index.css">
</head>

<body>

    <header class="main-header">
        <div class="header-logo">
            <a href="index.html" class="logo-link">
                <span class="brand">INFOMEX</span>
                <span class="separator">|</span>
                <span class="tagline">Sistema de acceso<br>a la información</span>
            </a>
        </div>

        <nav class="header-nav" id="headerNav" aria-label="Navegación principal">
            <a href="guias.html">Guías de usuario</a>
            <a href="tutorial.html">Tutorial de<br>versión pública</a>
            <a href="documentosApoyo.html">Documentos<br>de apoyo</a>
            <a href="glosario.html">Glosario</a>
        </nav>

        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir menú" aria-expanded="false"
            aria-controls="headerNav">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <main class="hero-section">

        <!-- PANEL DE ACCESIBILIDAD -->
        <div class="acc-wrapper">
            <div id="accBtn" class="acc-button" role="button" tabindex="0" aria-label="Abrir panel de accesibilidad"
                aria-expanded="false" aria-controls="accPanel">
                <i class="fa-solid fa-universal-access"></i>
            </div>
            <div id="accPanel" class="acc-panel">
                <div class="acc-header">
                    <i class="fa-solid fa-universal-access"></i>
                    <span>Accesibilidad</span>
                </div>
                <div class="acc-content">
                    <div class="font-size-row">
                        <button id="fontSmall" class="fs-btn">a -</button>
                        <input type="range" min="12" max="30" value="16" id="fontRange">
                        <button id="fontBig" class="fs-btn">A+</button>
                    </div>
                    <div class="darkmode-row">
                        <span>Modo nocturno</span>
                        <label class="switch">
                            <input type="checkbox" id="darkToggle" role="switch" aria-label="Modo nocturno"
                                onkeydown="if(event.key==='Enter'){event.preventDefault();this.click();}">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENIDO CENTRAL -->
        <div class="hero-content">
            <h2 class="welcome-title">Te damos la bienvenida al centro de ayuda de INFOMEX-INE</h2>

            <a href="guias.html" class="cta-btn" id="ctaGuiasUsuario">
                <i class="fas fa-book-open"></i>
                Guías de usuario
            </a>
        </div>

    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <img src="images/INE.png" alt="Logo INE" class="footer-logo">
            <span>© INE México 2026</span>
        </div>
    </footer>


    <script>
        // Panel accesibilidad
        const accBtn = document.getElementById("accBtn");
        const accPanel = document.getElementById("accPanel");
        accBtn.onclick = () => accPanel.classList.toggle("open");
        accBtn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); accPanel.classList.toggle("open"); } };

        // Menú hamburguesa
        const mobileBtn = document.getElementById('mobileMenuBtn');
        const headerNav = document.getElementById('headerNav');
        if (mobileBtn && headerNav) {
            mobileBtn.addEventListener('click', function () {
                headerNav.classList.toggle('active');
                const isExpanded = mobileBtn.getAttribute('aria-expanded') === 'true';
                mobileBtn.setAttribute('aria-expanded', !isExpanded);
            });
        }

        // Tamaño de letra
        const range = document.getElementById("fontRange");
        const small = document.getElementById("fontSmall");
        const big = document.getElementById("fontBig");
        function applyFont() { document.documentElement.style.fontSize = range.value + "px"; }
        range.oninput = applyFont;
        small.onclick = () => { range.value = Math.max(12, parseInt(range.value) - 2); applyFont(); };
        big.onclick = () => { range.value = Math.min(30, parseInt(range.value) + 2); applyFont(); };

        // Modo nocturno
        const darkToggle = document.getElementById("darkToggle");

        if (localStorage.getItem("darkmode") === "1") {
            document.body.classList.add("dark-mode");
            darkToggle.checked = true;
        }

        darkToggle.onchange = () => {
            document.body.classList.toggle("dark-mode");

            localStorage.setItem(
                "darkmode",
                document.body.classList.contains("dark-mode") ? "1" : "0"
            );
        };

    </script>

</body>

</html>
